<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Twilight Book Catalogue</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1 style="text-align:center;">Twilight Book Catalogue</h1>

<div class="book">
    <img src="Twilight.jpg" alt="Twilight Cover" class="book-img left">
    <div class="book-info">
        <h2>Twilight</h2>
        <p>2005</p>
    </div>
</div>

<div class="book">
    <img src="moon.jpg" alt="New Moon Cover" class="book-img right">
    <div class="book-info">
        <h2>New Moon</h2>
        <p>2006</p>
    </div>
</div>

<div class="book">
    <img src="eclipse.jpg" alt="Eclipse Cover" class="book-img left">
    <div class="book-info">
        <h2>Eclipse</h2>
        <p>2007</p>
    </div>
</div>

<div class="book">
    <img src="dawn.jpg" alt="Breaking Dawn Cover" class="book-img right">
    <div class="book-info">
        <h2>Breaking Dawn</h2>
        <p>2008</p>
    </div>
</div>
<div class="book">
    <img src="sun.jpg" alt="Midnight Sun Cover" class="book-img left">
    <div class="book-info">
        <h2>Midnight Sun</h2>
        <p>2020</p>
    </div>
</div>
</body>
</html>
